    <title>Document</title>
    <script>
            let bank={
          
            holder_name:"kashyap",
            holder_number:123456,
            account_balance:1000,
            
         
          deposit_balance:function(){
           let newDeposite=Number(prompt("eneter thre value"));
            this.account_balance += newDeposite;
          },
           withdraw_balance:function(newWithdrawal){
             if(this.account_balance<1000){
                console.log("insufficient balance");
            }
            else{
                  this.account_balance -= newWithdrawal;
            }
          },
          current_balance:function(){
            console.log(this.holder_name);
            console.log(this.holder_number); 
            console.log(this.account_balance);
        
          },


        }

let choice = prompt(
    "Choose an option:\n1. Deposit\n2. Withdraw\n3. Current Balance"
);

if (choice == 1) {
    bank.deposit_balance();
}
else if (choice == 2) {
    let amount = Number(prompt("Enter withdrawal amount:"));
    bank.withdraw_balance(amount);
}
else if (choice == 3) {
    bank.current_balance();
}
else {
    console.log("Invalid choice");
}

    </script>
