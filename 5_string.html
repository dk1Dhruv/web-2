<!-- string -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a="hello wworld";
        console.log(a);
    
        // let last=new string();
        //   last="hello world1";
        //    console.log(last);

        // string methods

        console.log(a.toUpperCase());
        console.log(a.toLowerCase());
        console.log(a.charAt(0));
        console.log(a.indexOf("w"));
        console.log(a.lastIndexOf("o"));
        console.log(a.slice(0,5));
        console.log(a.split(" "));
        console.log(a.includes("world"));
        console.log(a.replace("hello","hi"));
        console.log(a.concat(" how are you"));
    </script>
</head>
<body>
    <h1>String Example</h1>
    <p>This is a simple example of a string in JavaScript.</p>
</body>
</html>
